# Wear OS emulator smoke journey for the watch app. Manual, or called by native-checks.yml.
#
# This workflow runs only when someone presses "Run workflow" on the Actions
# tab (workflow_dispatch). It has no push, pull_request or schedule trigger and
# must never get one: an emulator run takes about 20 to 40 runner minutes
# (free on standard runners while the repository is public), it is run when
# someone decides to, and tests/readiness/test_manual_workflows.py fails if a
# trigger other than workflow_dispatch is added.
#
# What it does, on a standard ubuntu-latest runner:
#   1. enables /dev/kvm for the runner user (the documented udev rule), so the
#      x86_64 Wear OS image runs with hardware acceleration;
#   2. builds the watch debug APK exactly as the tests workflow does;
#   3. for the "care-journey" input, starts the demo backend (PostgreSQL 16 and
#      Redis service containers, the migration chain, the fictional demo seed,
#      scripts/demo/api.py on port 8000 with log-only message providers);
#   4. boots a Wear OS emulator with reactivecircus/android-emulator-runner
#      (pinned to a commit) and runs scripts/emulator/watch_smoke.py: install,
#      launch, pairing screen; and for "care-journey" also pairing with a real
#      code, permissions, the Help button, pressing Help, and the alert on the
#      server (the eleven core steps), then the extended groups chosen by the
#      "steps" input (default all: a medication reminder answered unclearly and
#      then confirmed in two steps, a requested check-in answered by touch, a
#      synthetic fall countdown with a second detection attached (D-092), Help
#      during a countdown and the responder on the wrist, a Help queued offline
#      and delivered once, a reboot, the sensor permission revoked and granted,
#      unpairing and pairing again, and the accessibility of the screens dumped);
#   5. uploads screenshots, UI dumps, logcat and results.json as an artifact.
# The watch app has no instrumented tests (watch/app/src/androidTest does not
# exist); if some are added, set the "instrumented" input to run them too.
name: emulator (manual)

on:
  workflow_dispatch:
    inputs:
      journey:
        description: "launch-only (pairing screen) or care-journey (pair, Help, alert on the server, then the extended groups)"
        type: choice
        options: [care-journey, launch-only]
        default: care-journey
      api_level:
        description: "Wear OS system image API level (33 = Wear OS 4, 34 = Wear OS 5)"
        type: choice
        options: ["34", "33"]
        default: "34"
      instrumented:
        description: "Also run connectedWearosDebugAndroidTest (only if androidTest sources exist)"
        type: boolean
        default: false
      steps:
        description: "Extended journey groups after the eleven core steps (care-journey only): all, or a comma list of medication, checkin, fall, help_during_fall, offline, reboot, permission, unpair, accessibility"
        type: string
        default: all
  # Also callable from native-checks.yml, which runs it on pull requests that change the watch
  # app (standard runners are free while the repository is public).
  workflow_call:
    inputs:
      journey:
        type: string
        default: care-journey
      api_level:
        type: string
        default: "34"
      instrumented:
        type: boolean
        default: false
      steps:
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IRA_CARE_MODEL: fake
  HF_HUB_OFFLINE: "1"

jobs:
  wear-emulator:
    name: Wear OS emulator smoke journey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ira_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres
      IRA_TEST_DATABASE_DSN: postgresql://ira_app:ira_app@127.0.0.1:5432/ira_test
      IRA_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ira_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build the watch debug APK (as the tests workflow does)
        working-directory: watch
        run: ./gradlew --no-daemon --console=plain assembleWearosDebug

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: inputs.journey == 'care-journey'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt

      - name: Start the demo backend on port 8000 (fictional data, log-only providers)
        if: inputs.journey == 'care-journey'
        working-directory: supracloud-jarvis/ira
        run: |
          set -euo pipefail
          pip install -q -r requirements-test.txt
          pip install -q --no-deps --require-hashes -r requirements-nodeps.txt
          # The demo starts the worker scheduler, whose security monitor needs psutil; the test
          # requirements do not include it. Take the pinned version from the runtime requirements.
          pip install -q "$(grep -E '^psutil==' requirements.txt)"
          psql -h 127.0.0.1 -U postgres -d ira_test -v ON_ERROR_STOP=1 -q -f ../postgres/provisioning/001_database_roles.sql
          psql -h 127.0.0.1 -U postgres -d ira_test -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE ira_migrator PASSWORD 'ira_migrator'; ALTER ROLE ira_app PASSWORD 'ira_app'; ALTER ROLE ira_worker PASSWORD 'ira_worker';"
          python -m scripts.migrate apply --dsn postgresql://ira_migrator:ira_migrator@127.0.0.1:5432/ira_test
          cd "$GITHUB_WORKSPACE"
          python scripts/demo/seed_demo.py --out "$RUNNER_TEMP/seed.json" > /dev/null
          IRA_CARE_DEMO_PORT=8000 nohup python scripts/demo/api.py > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Boot the Wear OS emulator and run the smoke journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api_level }}
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/emulator/watch_smoke.py --apk watch/app/build/outputs/apk/wearos/debug/app-wearos-debug.apk --out build/emulator-smoke ${{ inputs.journey == 'care-journey' && format('--api http://127.0.0.1:8000 --credentials {0}/seed.json --steps "{1}"', runner.temp, inputs.steps) || '' }} && if [ "${{ inputs.instrumented }}" = "true" ] && [ -d watch/app/src/androidTest ]; then (cd watch && ./gradlew --no-daemon --console=plain connectedWearosDebugAndroidTest); fi

      - name: Show the end of the demo API log (on failure)
        if: failure() && inputs.journey == 'care-journey'
        run: tail -n 60 "$RUNNER_TEMP/api.log" || true

      - name: Upload screenshots, UI dumps, logcat and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wear-emulator-smoke-api${{ inputs.api_level }}
          path: |
            build/emulator-smoke/
            ${{ runner.temp }}/api.log
          if-no-files-found: warn
          retention-days: 14
