# iOS simulator build of the family app (mobile/). MANUAL ONLY.
#
# Cost: this job runs on a GitHub-hosted macOS runner. The repository is public,
# and standard hosted runners (Linux and macOS) cost nothing for a public
# repository. If it is ever made private again, macOS minutes are billed at 10
# times the Linux rate (one minute here uses ten minutes of the monthly
# allowance; a run takes roughly 20 to 40 minutes). Either way it runs only
# when someone presses "Run workflow" on the Actions tab (workflow_dispatch).
# It has no push, pull_request or schedule trigger and must never get one:
# tests/readiness/test_manual_workflows.py fails if any other trigger is added.
#
# What it does: Node 22, `npm ci`, `npx expo prebuild --platform ios` (the ios/
# folder is generated here and never committed), `pod install`, then an
# unsigned Debug build for the iOS simulator with xcodebuild
# (CODE_SIGNING_ALLOWED=NO, so no Apple certificate or account is needed). The
# built IRACARE.app is uploaded as an artifact; it runs in the iOS Simulator
# (`xcrun simctl install booted IRACARE.app`), not on a phone.
name: ios-simulator (manual)

on:
  workflow_dispatch:
  # Also callable from native-checks.yml, which runs it on pull requests that change the phone
  # app (standard runners, including macOS, are free while the repository is public).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    name: iOS simulator build (unsigned, Debug)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate the iOS project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install
      - name: Build for the iOS simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          # FORCE_BUNDLING: the Debug configuration otherwise leaves the JavaScript to a development
          # server; bundling it makes the .app launch on its own in the simulator (the launch job
          # below). It is still the Debug configuration (__DEV__ true), which the journey probe needs.
          FORCE_BUNDLING=1 xcodebuild -workspace IRACARE.xcworkspace -scheme IRACARE \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee xcodebuild.log | tail -n 200
      - name: Package the .app
        working-directory: mobile/ios
        run: |
          app=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/IRACARE-simulator.app.zip"
          ls -l "$RUNNER_TEMP/IRACARE-simulator.app.zip"
      - name: Upload the simulator app and the build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-app
          path: |
            ${{ runner.temp }}/IRACARE-simulator.app.zip
            mobile/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
      # Round 9: the same runner then launches what it built. An available iPhone simulator is
      # booted, the .app installed and started with its console attached, and the development
      # bundle's journey probe says which screen is showing (scripts/simulator/ios_journey.py).
      - name: Launch the app in the simulator and read its screens
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcrun simctl list devices available | head -40
          app=$(find mobile/ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          # Is the JavaScript in the app? Without it the Debug build has nothing to fall back to
          # once it finds no development server (run 45984425019: no JavaScript ran at all).
          ls -la "$app"/main.jsbundle "$app"/*.jsbundle 2>&1 | head -5 || true
          grep -E "Skipping bundling|FORCE_BUNDLING|main.jsbundle|react-native-xcode" mobile/ios/xcodebuild.log | tail -8 || true
          python3 scripts/simulator/ios_journey.py --app "$app" --out build/ios-journey --seconds 90
      - name: Upload the screenshot, console, app log and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-journey
          path: build/ios-journey/
          if-no-files-found: warn
          retention-days: 14

