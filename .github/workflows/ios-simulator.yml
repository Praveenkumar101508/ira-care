# iOS simulator build of the family app (mobile/). MANUAL ONLY.
#
# Cost: this job runs on a GitHub-hosted macOS runner. The repository is public,
# and standard hosted runners (Linux and macOS) cost nothing for a public
# repository. If it is ever made private again, macOS minutes are billed at 10
# times the Linux rate (one minute here uses ten minutes of the monthly
# allowance; a run takes roughly 20 to 40 minutes). Either way it runs only
# when someone presses "Run workflow" on the Actions tab (workflow_dispatch).
# It has no push, pull_request or schedule trigger and must never get one:
# tests/readiness/test_manual_workflows.py fails if any other trigger is added.
#
# What it does: Node 22, `npm ci`, `npx expo prebuild --platform ios` (the ios/
# folder is generated here and never committed), `pod install`, then an
# unsigned Debug build for the iOS simulator with xcodebuild
# (CODE_SIGNING_ALLOWED=NO, so no Apple certificate or account is needed). The
# built IRACARE.app is uploaded as an artifact; it runs in the iOS Simulator
# (`xcrun simctl install booted IRACARE.app`), not on a phone.
name: ios-simulator (manual)

on:
  workflow_dispatch:
  # Also callable from native-checks.yml, which runs it on pull requests that change the phone
  # app (standard runners, including macOS, are free while the repository is public).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    name: iOS simulator build (unsigned, Debug)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Point the test build at the journey's care server
        # The Android test build's default server is the emulator's host (10.0.2.2, app.json); the iOS
        # simulator shares the Mac's loopback, so its test build defaults to 127.0.0.1:8000. Only this
        # job's copy changes; nothing is committed and the release builds keep app.json as it is.
        run: node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f));j.expo.extra.careApiBaseUrl='http://127.0.0.1:8000';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Generate the iOS project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install
      - name: Build for the iOS simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          # FORCE_BUNDLING: the Debug configuration otherwise leaves the JavaScript to a development
          # server; bundling it makes the .app launch on its own in the simulator (the launch job
          # below). It is still the Debug configuration (__DEV__ true), which the journey probe needs.
          # Passed as a build setting, which Xcode exports to the build's scripts; set only in the
          # environment it never reached react-native-xcode.sh (run 45988252843: no main.jsbundle).
          FORCE_BUNDLING=1 xcodebuild -workspace IRACARE.xcworkspace -scheme IRACARE \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO FORCE_BUNDLING=1 build | tee xcodebuild.log | tail -n 200
      - name: Make sure the JavaScript is inside the app
        working-directory: mobile
        run: |
          set -euo pipefail
          app=$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if [ ! -f "$app/main.jsbundle" ]; then
            echo "main.jsbundle missing after the build: writing it with Expo's own bundler (development bundle)"
            npx expo export:embed --platform ios --dev true --entry-file index.ts \
              --bundle-output "$app/main.jsbundle" --assets-dest "$app"
          fi
          ls -la "$app/main.jsbundle"
      - name: Package the .app
        working-directory: mobile/ios
        run: |
          app=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/IRACARE-simulator.app.zip"
          ls -l "$RUNNER_TEMP/IRACARE-simulator.app.zip"
      - name: Upload the simulator app and the build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-app
          path: |
            ${{ runner.temp }}/IRACARE-simulator.app.zip
            mobile/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
      # Round 9: the same runner then launches what it built. An available iPhone simulator is
      # booted, the .app installed and started with its console attached, and the development
      # bundle's journey probe says which screen is showing (scripts/simulator/ios_journey.py).
      - name: Launch the app in the simulator and read its screens
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcrun simctl list devices available | head -40
          app=$(find mobile/ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          # Is the JavaScript in the app? Without it the Debug build has nothing to fall back to
          # once it finds no development server (run 45984425019: no JavaScript ran at all).
          python3 scripts/simulator/ios_journey.py --app "$app" --out build/ios-journey --seconds 90
      - name: Upload the screenshot, console, app log and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-journey
          path: build/ios-journey/
          if-no-files-found: warn
          retention-days: 14

      # ── The authenticated care journey (register D2.h) ─────────────────────────────────
      # The macOS runner has no Docker, so the database and Redis come from Homebrew; the care
      # server, the seed and the journey's API side are the Android job's own. Maestro (open
      # source) drives the simulator. Fictional data only; providers log, nothing is sent.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Start PostgreSQL with pgvector and Redis, then migrate and seed
        working-directory: ${{ github.workspace }}/supracloud-jarvis/ira
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          brew install postgresql@17 redis
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          # pgvector built against this PostgreSQL: Homebrew's pgvector bottle follows its newest
          # PostgreSQL and was missing for @17 on one runner image (run 46036510723).
          git clone --quiet --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          make -s -C "$RUNNER_TEMP/pgvector" PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          make -s -C "$RUNNER_TEMP/pgvector" install PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          brew services start postgresql@17
          brew services start redis
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 2; done
          psql -h 127.0.0.1 -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE postgres WITH SUPERUSER LOGIN PASSWORD 'postgres';"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ira_test"
          pip install -q -r requirements-test.txt
          pip install -q --no-deps --require-hashes -r requirements-nodeps.txt
          pip install -q "$(grep -E '^psutil==' requirements.txt)"
          psql -h 127.0.0.1 -U postgres -d ira_test -v ON_ERROR_STOP=1 -q -f ../postgres/provisioning/001_database_roles.sql
          psql -h 127.0.0.1 -U postgres -d ira_test -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE ira_migrator PASSWORD 'ira_migrator'; ALTER ROLE ira_app PASSWORD 'ira_app'; ALTER ROLE ira_worker PASSWORD 'ira_worker';"
          python -m scripts.migrate apply --dsn postgresql://ira_migrator:ira_migrator@127.0.0.1:5432/ira_test
          redis-cli ping
          cd "$GITHUB_WORKSPACE"
          IRA_CARE_MODEL=fake HF_HUB_OFFLINE=1 POSTGRES_DB=ira_test \
            IRA_TEST_DATABASE_DSN=postgresql://ira_app:ira_app@127.0.0.1:5432/ira_test \
            IRA_TEST_ADMIN_DSN=postgresql://postgres:postgres@127.0.0.1:5432/ira_test \
            python scripts/demo/seed_demo.py --out "$RUNNER_TEMP/seed.json" > /dev/null
      - name: Install Maestro
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: The authenticated care journey in the simulator
        working-directory: ${{ github.workspace }}
        env:
          IRA_CARE_MODEL: fake
          HF_HUB_OFFLINE: "1"
          PGPASSWORD: postgres
          POSTGRES_DB: ira_test
          IRA_TEST_DATABASE_DSN: postgresql://ira_app:ira_app@127.0.0.1:5432/ira_test
          IRA_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ira_test
          IRA_CARE_DEMO_PORT: "8000"
        run: |
          set -o pipefail
          udid=$(python3 -c "import json; print(next(s['udid'] for s in json.load(open('build/ios-journey/results.json'))['steps'] if s['step']=='simulator_booted'))")
          python3 scripts/simulator/ios_care_journey.py --udid "$udid" --api http://127.0.0.1:8000 \
            --credentials "$RUNNER_TEMP/seed.json" --out build/ios-care-journey \
            --api-cmd "python3 scripts/demo/api.py"
      - name: Keep Maestro's own debug record with the results
        if: always()
        working-directory: ${{ github.workspace }}
        run: cp -R "$HOME/.maestro/tests" build/ios-care-journey/maestro-debug 2>/dev/null || true
      - name: Upload the care journey's screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-care-journey
          path: build/ios-care-journey/
          if-no-files-found: warn
          retention-days: 14
