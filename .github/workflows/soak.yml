# The longest wall-clock soak a free standard runner can hold. Manual only.
#
# GitHub-hosted jobs stop at 6 hours (docs.github.com/en/actions/reference/limits, read
# 27 November 2026), so the 24-hour soak (register G2.e) cannot run here; this runs the same
# harness, scripts/soak_wallclock.py, for up to 5.5 hours on ubuntu-latest against the demo API
# with fictional data and log-only providers, and uploads summary.json and checkpoint.jsonl. It is
# evidence of a longer run, never presented as the 24-hour result (docs/evidence/soak/HOW_TO_RUN_24H.md).
# Runs only by hand: tests/readiness/test_manual_workflows.py fails if any other trigger is added.
name: wall-clock soak (manual)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to run (at most 5.5: the job limit is 6 hours)"
        type: choice
        options: ["5.5", "3", "1"]
        default: "5.5"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Wall-clock soak on a standard runner
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ira_soak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ira_soak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      IRA_CARE_MODEL: fake
      HF_HUB_OFFLINE: "1"
      PGPASSWORD: postgres
      POSTGRES_DB: ira_soak
      IRA_TEST_DATABASE_DSN: postgresql://ira_app:ira_app@127.0.0.1:5432/ira_soak
      IRA_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ira_soak
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt
      - name: Install and migrate the soak database
        working-directory: supracloud-jarvis/ira
        run: |
          set -euo pipefail
          pip install -q -r requirements-test.txt
          pip install -q --no-deps --require-hashes -r requirements-nodeps.txt
          pip install -q "$(grep -E '^psutil==' requirements.txt)"
          psql -h 127.0.0.1 -U postgres -d ira_soak -v ON_ERROR_STOP=1 -q -f ../postgres/provisioning/001_database_roles.sql
          psql -h 127.0.0.1 -U postgres -d ira_soak -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE ira_migrator PASSWORD 'ira_migrator'; ALTER ROLE ira_app PASSWORD 'ira_app'; ALTER ROLE ira_worker PASSWORD 'ira_worker';"
          python -m scripts.migrate apply --dsn postgresql://ira_migrator:ira_migrator@127.0.0.1:5432/ira_soak
      - name: Run the soak
        run: |
          python3 scripts/soak_wallclock.py --start-demo --no-quiet-hours --hours "${{ inputs.hours }}" \
            --label "wall-clock soak on a standard runner (${{ inputs.hours }} h)" --out "$RUNNER_TEMP/soak"
      - name: Summarise
        if: always()
        run: python3 scripts/soak_wallclock.py --summarise "$RUNNER_TEMP/soak/checkpoint.jsonl" || true
      - name: Keep the evidence (no logins)
        if: always()
        run: |
          mkdir -p evidence
          cp "$RUNNER_TEMP/soak/summary.json" evidence/ 2>/dev/null || true
          gzip -c "$RUNNER_TEMP/soak/checkpoint.jsonl" > evidence/checkpoint.jsonl.gz 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: soak-evidence
          path: evidence/
          retention-days: 30
