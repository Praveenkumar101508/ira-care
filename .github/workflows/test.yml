# IRA CARE continuous integration.
#
# Every pull request and every push to main runs here, on Linux runners only.
# A pull request merges only when every job below is green.
#
# Jobs:
#   backend-unit      the whole backend suite without a database (DB tests skip)
#   backend-database  the database suites against PostgreSQL 16 + pgvector,
#                     with the migration chain applied the sanctioned way
#                     (provisioned roles, scripts.migrate as ira_migrator)
#   backend-lint      ruff with the repository's own rule set (zero findings)
#   secrets           gitleaks over the whole git history (.gitleaksignore lists the
#                     accepted historical placeholders with their reasons)
#   watch             Wear OS app: Gradle build and unit tests (when watch/ exists)
#   mobile            family app: licence check, type check and tests (when mobile/ exists)
#   dashboard         carer dashboard: licence check, build and tests (when dashboard/ exists)
#
# Every job is gated on the "detect" job: a client job runs when its directory exists and
# its files (or something shared) changed; the backend jobs run when backend files (or
# something shared) changed; and a push to main whose tree already passed as a pull
# request head skips the heavy jobs (scripts/ci/already_tested.sh). No test is removed:
# a pull request that touches an area always runs that area's whole suite. Nothing here
# uses a paid runner or a paid service. docs/evidence/ci/minutes.json records the minutes
# before and after these rules (round 3, phase 15).
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  HF_HUB_OFFLINE: "1"
  # IRA CARE's conversation service: CI uses the deterministic fake model, never a real one.
  IRA_CARE_MODEL: fake

jobs:
  detect:
    name: Detect components and changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      watch: ${{ steps.probe.outputs.watch }}
      mobile: ${{ steps.probe.outputs.mobile }}
      dashboard: ${{ steps.probe.outputs.dashboard }}
      backend: ${{ steps.changes.outputs.backend }}
      watch_changed: ${{ steps.changes.outputs.watch }}
      mobile_changed: ${{ steps.changes.outputs.mobile }}
      dashboard_changed: ${{ steps.changes.outputs.dashboard }}
      already_tested: ${{ steps.tree.outputs.already_tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: probe
        run: |
          echo "watch=$([ -f watch/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mobile=$([ -f mobile/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dashboard=$([ -f dashboard/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Path filters inside the workflow: a job runs when the files it tests changed, or when
      # anything it shares changed (the workflow, the CI scripts, the migrations, the deploy
      # files). Pure documentation changes run only the secret scan and this job.
      - id: changes
        run: bash scripts/ci/changed_areas.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}" >> "$GITHUB_OUTPUT"
      # A push to main whose tree already passed as a pull request head does not run the
      # heavy jobs again: the tests of an identical tree cannot say anything new.
      - id: tree
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/already_tested.sh >> "$GITHUB_OUTPUT"

  backend-unit:
    name: Backend unit tests
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: supracloud-jarvis/ira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt
      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt
          pip install --no-deps --require-hashes -r requirements-nodeps.txt
      # The scanned-PDF test (tests/test_chat_scanned_pdf.py) renders a page with pdftoppm and
      # reads it with tesseract; without them it skips. Both are in Ubuntu's own repositories.
      - name: Install the OCR tools the scanned-PDF test needs
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -q poppler-utils tesseract-ocr >/dev/null
      # -ra names every skip in the log, so a test that stops running is visible.
      - name: Run the suite (database tests skip here; they run in backend-database)
        run: python -m pytest -q -ra -p no:cacheprovider tests

  backend-database:
    name: Backend database tests
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: supracloud-jarvis/ira
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iratest
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d iratest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The durable "log out everywhere" tests (tests/tenancy/test_global_logout_durable.py)
      # produce Redis failures by their effect on a real Redis: a deleted key, a lost
      # key set, an older snapshot. Without this service they skipped.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      # The application role: everything that asserts "the other tenant cannot
      # see this" connects as ira_app, never as a superuser.
      IRA_TEST_DATABASE_DSN: postgresql://ira_app:ira_app@localhost:5432/iratest
      # The privileged role that seeds fixtures.
      IRA_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/iratest
      # Declares that this job must reach a database: a missing DSN is a
      # failure here, not a skip (tests/tenancy/test_harness_is_configured.py).
      IRA_REQUIRE_DB_HARNESS: "1"
      # Database 9 of the service above; each test clears what it writes.
      IRA_TEST_REDIS_URL: redis://localhost:6379/9
      # The passwords of the three provisioned roles, for the tests that connect by role
      # name alone (postgresql://ira_migrator@...): tests/runtime/test_migration_runner_separation.py
      # and tests/tenancy/test_rls_by_role.py. The service authenticates every TCP connection
      # with a password, so without this file those tests skipped with "cannot connect as".
      PGPASSFILE: ${{ runner.temp }}/pgpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt
      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt psycopg2-binary
          pip install --no-deps --require-hashes -r requirements-nodeps.txt
      - name: Provision database roles
        run: |
          psql -h localhost -U postgres -d iratest -v ON_ERROR_STOP=1 \
            -f ../postgres/provisioning/001_database_roles.sql
          psql -h localhost -U postgres -d iratest -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE ira_migrator PASSWORD 'ira_migrator'; ALTER ROLE ira_app PASSWORD 'ira_app'; ALTER ROLE ira_worker PASSWORD 'ira_worker';"
      # The adversarial suites provoke thousands of refused statements on
      # purpose. Without this the service container's log of them (printed at
      # the end of the job) buries the test summary thousands of lines deep.
      - name: Quiet the database's log of refused statements
        run: |
          psql -h localhost -U postgres -d iratest -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
            -c "SELECT pg_reload_conf()"
      - name: Apply the migration chain as ira_migrator
        run: python -m scripts.migrate apply --dsn postgresql://ira_migrator:ira_migrator@localhost:5432/iratest
      - name: Role passwords for the tests that connect by role name
        run: |
          printf '%s\n' 'localhost:5432:*:ira_app:ira_app' 'localhost:5432:*:ira_worker:ira_worker' \
            'localhost:5432:*:ira_migrator:ira_migrator' > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
      - name: Applied migrations are unchanged
        run: python -m scripts.check_migration_integrity
      - name: Run the database suites
        # PGPASSWORD takes precedence over the passfile in asyncpg and libpq alike, and the
        # job's value is the superuser's; the suites carry their passwords in the DSNs.
        run: |
          set -o pipefail
          unset PGPASSWORD
          python -m pytest -q -ra -p no:cacheprovider \
            tests/tenancy tests/readiness tests/architecture \
            tests/callers tests/idempotency tests/runtime 2>&1 | tee database-tests.log
      - name: Backup and restore round trip
        # The nightly backup script and the restore script, exactly as the
        # deployment runs them: dump the test database encrypted, restore it into
        # an empty database, and compare the table count and the migration ledger.
        working-directory: ${{ github.workspace }}
        env:
          BACKUP_PASSPHRASE: ci-only-passphrase-not-a-secret
          BACKUP_DIR: ${{ runner.temp }}/backups
          BACKUP_DSN: postgresql://postgres:postgres@localhost:5432/iratest
        run: |
          set -euo pipefail
          # The client tools must match the PostgreSQL 16 service: a newer pg_dump
          # writes settings a 16 server refuses on restore. The runner's own lists
          # carry only the newest client, so the PostgreSQL apt repository is added.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -q postgresql-client-16 >/dev/null
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          pg_dump --version
          sh deploy/backup.sh
          f=$(ls -t "$BACKUP_DIR"/*.enc | head -1)
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE iratest_restore"
          sh deploy/restore.sh "$f" postgresql://postgres:postgres@localhost:5432/iratest_restore
          a=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest -c "select count(*) from information_schema.tables where table_schema='public'")
          b=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest_restore -c "select count(*) from information_schema.tables where table_schema='public'")
          m1=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest -c "select count(*) from schema_migrations")
          m2=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest_restore -c "select count(*) from schema_migrations")
          echo "tables $a -> $b; migrations $m1 -> $m2"
          test "$a" = "$b" && test "$m1" = "$m2"
      - name: Test summary
        if: always()
        run: |
          echo "## Backend database tests" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR) |[0-9]+ (passed|failed)" database-tests.log | tail -80 | tee -a "$GITHUB_STEP_SUMMARY" || true

  docs-truth:
    name: Readiness tells the truth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs_truth.py
      # The evidence pack index (L.c), generated from requirements.json on every run and kept
      # as an artifact rather than committed, so it is never stale (scripts/evidence_index.py).
      - name: Generate the evidence index
        run: python3 scripts/evidence_index.py --write
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-index
          path: docs/evidence/INDEX.md
          retention-days: 30

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/gitleaks.sh

  backend-lint:
    name: Backend lint
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supracloud-jarvis/ira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt
      - run: pip install ruff
      - run: ruff check .

  watch:
    name: Watch app (Wear OS and AOSP)
    needs: detect
    if: needs.detect.outputs.watch == 'true' && needs.detect.outputs.watch_changed == 'true' && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test both platforms (Wear OS, plain AOSP)
        run: ./gradlew --no-daemon --console=plain assembleWearosDebug assembleAospDebug testWearosDebugUnitTest testAospDebugUnitTest
      - name: The AOSP flavour carries no Google service dependency
        working-directory: .
        run: bash scripts/ci/check_watch_aosp_deps.sh
      - name: Build both release APKs (what ships)
        run: ./gradlew --no-daemon --console=plain assembleWearosRelease assembleAospRelease
      - name: Licence check of the release runtime classpath (both flavours)
        working-directory: .
        run: python3 scripts/licence_check.py --check --only gradle-watch
      - name: The release APKs contain what the classpath says (native libraries, models)
        working-directory: .
        run: python3 scripts/supply_chain.py apk --check

  mobile:
    name: Family app (Expo)
    needs: detect
    if: needs.detect.outputs.mobile == 'true' && needs.detect.outputs.mobile_changed == 'true' && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Licences of the production dependency tree against the policy (K.d), and the committed
      # inventory docs/security/LICENCES.json still describes it (scripts/licence_check.py).
      - name: Licence check of the shipped dependencies
        run: python3 ../scripts/licence_check.py --check --only npm-mobile
      - run: npm run typecheck
      - run: npm test

  mobile-android:
    name: Family app Android build
    needs: detect
    # The native Android build of the family app: Expo prebuild into a throwaway android/ folder,
    # then a release APK with debug signing (no store key exists). It runs here because one
    # dependency (the image cropper behind expo-image-picker) is only on jitpack.io, which the
    # development sandbox cannot reach (docs/evidence/builds/ANDROID.md).
    if: needs.detect.outputs.mobile == 'true' && needs.detect.outputs.mobile_changed == 'true' && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate the native Android project (not committed)
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK (debug signing, arm64-v8a)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Record the APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          ls -l "$apk"
          echo "### Family app APK: $(stat -c %s "$apk") bytes" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Container images build
    needs: detect
    # The images were never built in CI before, and both deployment images turned out broken
    # (REMEDIATION G1, G2, G4). Build all three and check what broke: the API runs as a
    # non-root user and carries its migrations; the backup image has openssl and pg_dump.
    if: (needs.detect.outputs.backend == 'true' || needs.detect.outputs.dashboard_changed == 'true') && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t ira-care/api:ci .
      - name: Build the dashboard image
        run: docker build -f deploy/Dockerfile.dashboard -t ira-care/dashboard:ci .
      - name: Build the backup image
        run: docker build -f deploy/Dockerfile.backup -t ira-care/backup:ci .
      - name: The API image runs as a non-root user and carries its migrations
        run: |
          uid=$(docker run --rm --entrypoint id ira-care/api:ci -u)
          echo "API user id: $uid"; test "$uid" != "0"
          n=$(docker run --rm --entrypoint sh ira-care/api:ci -c 'ls "$IRA_MIGRATIONS_DIR"/*.sql | wc -l')
          echo "migrations in the image: $n"; test "$n" -gt 100
      - name: The backup image can encrypt and dump
        run: docker run --rm --network none --entrypoint sh ira-care/backup:ci -c 'openssl version && pg_dump --version && curl --version && test -x /usr/local/bin/backup.sh && test -x /usr/local/bin/restore.sh && test -x /usr/local/bin/offsite.sh'
      - name: Each image carries its third-party notices
        run: |
          for i in api dashboard backup; do
            docker run --rm --network none --entrypoint cat "ira-care/$i:ci" /usr/share/doc/ira-care/THIRD_PARTY_NOTICES.txt | cmp - "docs/legal/notices/$i-image.txt"
          done
      - name: The API image loads the care server and worker from its locked packages alone
        run: |
          docker run --rm --network none -e IRA_SECRET_KEY=ci-placeholder -e IRA_ADMIN_PASSWORD=ci-placeholder \
            -e POSTGRES_PASSWORD=ci-placeholder -e REDIS_PASSWORD=ci-placeholder \
            --entrypoint python ira-care/api:ci -c "import care.server, care.worker"
      - name: What the images contain, against the licence policy (docs/security/sbom/)
        run: |
          mkdir -p sbom-out
          python3 scripts/supply_chain.py image api ira-care/api:ci --base python:3.12-slim --check --out sbom-out/api-image.inventory.json
          python3 scripts/supply_chain.py image dashboard ira-care/dashboard:ci --base node:22-alpine --check --out sbom-out/dashboard-image.inventory.json
          python3 scripts/supply_chain.py image backup ira-care/backup:ci --base postgres:16-alpine --check --out sbom-out/backup-image.inventory.json
      - name: Full CycloneDX SBOMs of the images (syft, pinned by checksum)
        run: |
          v=1.18.1; sum=066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab
          curl -fsSLo syft.tgz "https://github.com/anchore/syft/releases/download/v$v/syft_${v}_linux_amd64.tar.gz"
          echo "$sum  syft.tgz" | sha256sum -c
          tar xzf syft.tgz syft
          for i in api dashboard backup; do ./syft "docker:ira-care/$i:ci" -q -o "cyclonedx-json=sbom-out/$i-image.syft.cdx.json"; done
      - uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: sbom-out/
          retention-days: 30

  dashboard:
    name: Carer dashboard (Next.js)
    needs: detect
    if: needs.detect.outputs.dashboard == 'true' && needs.detect.outputs.dashboard_changed == 'true' && needs.detect.outputs.already_tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/cache@v4
        with:
          path: dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-${{ hashFiles('dashboard/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-
      - run: npm ci
      # Licences of the production dependency tree against the policy (K.d), and the committed
      # inventory docs/security/LICENCES.json still describes it (scripts/licence_check.py).
      - name: Licence check of the shipped dependencies
        run: python3 ../scripts/licence_check.py --check --only npm-dashboard
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
