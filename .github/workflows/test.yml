# IRA CARE continuous integration.
#
# Every pull request and every push to main runs here, on Linux runners only.
# A pull request merges only when every job below is green.
#
# Jobs:
#   backend-unit      the whole backend suite without a database (DB tests skip)
#   backend-database  the database suites against PostgreSQL 16 + pgvector,
#                     with the migration chain applied the sanctioned way
#                     (provisioned roles, scripts.migrate as ira_migrator)
#   backend-lint      ruff with the repository's own rule set (zero findings)
#   secrets           gitleaks over the whole git history (.gitleaksignore lists the
#                     accepted historical placeholders with their reasons)
#   watch             Wear OS app: Gradle build and unit tests (when watch/ exists)
#   mobile            family app: type check and tests (when mobile/ exists)
#   dashboard         carer dashboard: build and tests (when dashboard/ exists)
#
# The three client jobs are gated on a "detect" job so the workflow stays green
# while a client has not been built yet, and starts enforcing the moment its
# directory appears. Nothing here uses a paid runner or a paid service.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  HF_HUB_OFFLINE: "1"
  # IRA CARE's conversation service: CI uses the deterministic fake model, never a real one.
  IRA_CARE_MODEL: fake

jobs:
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      watch: ${{ steps.probe.outputs.watch }}
      mobile: ${{ steps.probe.outputs.mobile }}
      dashboard: ${{ steps.probe.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          echo "watch=$([ -f watch/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mobile=$([ -f mobile/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dashboard=$([ -f dashboard/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: supracloud-jarvis/ira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run the suite (database tests skip here; they run in backend-database)
        run: python -m pytest -q -p no:cacheprovider tests

  backend-database:
    name: Backend database tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: supracloud-jarvis/ira
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iratest
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d iratest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      # The application role: everything that asserts "the other tenant cannot
      # see this" connects as ira_app, never as a superuser.
      IRA_TEST_DATABASE_DSN: postgresql://ira_app:ira_app@localhost:5432/iratest
      # The privileged role that seeds fixtures.
      IRA_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/iratest
      # Declares that this job must reach a database: a missing DSN is a
      # failure here, not a skip (tests/tenancy/test_harness_is_configured.py).
      IRA_REQUIRE_DB_HARNESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supracloud-jarvis/ira/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt psycopg2-binary
      - name: Provision database roles
        run: |
          psql -h localhost -U postgres -d iratest -v ON_ERROR_STOP=1 \
            -f ../postgres/provisioning/001_database_roles.sql
          psql -h localhost -U postgres -d iratest -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE ira_migrator PASSWORD 'ira_migrator'; ALTER ROLE ira_app PASSWORD 'ira_app'; ALTER ROLE ira_worker PASSWORD 'ira_worker';"
      # The adversarial suites provoke thousands of refused statements on
      # purpose. Without this the service container's log of them (printed at
      # the end of the job) buries the test summary thousands of lines deep.
      - name: Quiet the database's log of refused statements
        run: |
          psql -h localhost -U postgres -d iratest -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
            -c "SELECT pg_reload_conf()"
      - name: Apply the migration chain as ira_migrator
        run: python -m scripts.migrate apply --dsn postgresql://ira_migrator:ira_migrator@localhost:5432/iratest
      - name: Applied migrations are unchanged
        run: python -m scripts.check_migration_integrity
      - name: Run the database suites
        run: |
          set -o pipefail
          python -m pytest -q -ra -p no:cacheprovider \
            tests/tenancy tests/readiness tests/architecture \
            tests/callers tests/idempotency tests/runtime 2>&1 | tee database-tests.log
      - name: Backup and restore round trip
        # The nightly backup script and the restore script, exactly as the
        # deployment runs them: dump the test database encrypted, restore it into
        # an empty database, and compare the table count and the migration ledger.
        working-directory: ${{ github.workspace }}
        env:
          BACKUP_PASSPHRASE: ci-only-passphrase-not-a-secret
          BACKUP_DIR: ${{ runner.temp }}/backups
          BACKUP_DSN: postgresql://postgres:postgres@localhost:5432/iratest
        run: |
          set -euo pipefail
          # The client tools must match the PostgreSQL 16 service: a newer pg_dump
          # writes settings a 16 server refuses on restore. The runner's own lists
          # carry only the newest client, so the PostgreSQL apt repository is added.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -q postgresql-client-16 >/dev/null
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          pg_dump --version
          sh deploy/backup.sh
          f=$(ls -t "$BACKUP_DIR"/*.enc | head -1)
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE iratest_restore"
          sh deploy/restore.sh "$f" postgresql://postgres:postgres@localhost:5432/iratest_restore
          a=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest -c "select count(*) from information_schema.tables where table_schema='public'")
          b=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest_restore -c "select count(*) from information_schema.tables where table_schema='public'")
          m1=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest -c "select count(*) from schema_migrations")
          m2=$(psql -At postgresql://postgres:postgres@localhost:5432/iratest_restore -c "select count(*) from schema_migrations")
          echo "tables $a -> $b; migrations $m1 -> $m2"
          test "$a" = "$b" && test "$m1" = "$m2"
      - name: Test summary
        if: always()
        run: |
          echo "## Backend database tests" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR) |[0-9]+ (passed|failed)" database-tests.log | tail -80 | tee -a "$GITHUB_STEP_SUMMARY" || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/gitleaks.sh

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supracloud-jarvis/ira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  watch:
    name: Watch app (Wear OS)
    needs: detect
    if: needs.detect.outputs.watch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test
        run: ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest

  mobile:
    name: Family app (Expo)
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dashboard:
    name: Carer dashboard (Next.js)
    needs: detect
    if: needs.detect.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
